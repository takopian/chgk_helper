tcld_-4hd.js\",\"/_next/static/chunks/0sofpk8le2r52.js\"],\"default\"]\n1a:Tee7,Доброе утро, уважаемые знатоки.\nМы сочли за лучшее разрешить все технические вопросы до того как прослушать бессмертное произведение Рихарда Штрауса.\nИтак, мы, команда «Сильмариллион», приветствуем вас сегодня в этом зале на втором туре чемпионата города Гомеля по «Что? Где? Когда?» «Суперсерия – 2003/04». Наш тур состоит из двух блоков по 15 вопросов в каждом, авторы вопросов – Ксения Чиндарова, Влад Дронов и Евгений Миротин, редактор пакета – Евгений Миротин. Вести тур буду я, а помогут мне в этом ….\nПри составлении пакета мы постарались учесть ошибки прошлого тура команды «Сильмариллион» и преимущества позапрошлого и составить пакет, сочетающий в себе приемлемую сложность и необходимую для спортивного соревнования дистанцию. При этом мы пользовались следующим рецептом: в необходимой пропорции смешать легкие, средние и сложные вопросы, приправить юмором, вмешать немного злобы дня и нафталина истории, уважить классиков и современников (по кусочку тех и других), ответы добавить по вкусу. Надеемся, что каждая команда найдет в пакете вопросы на близкие ей темы.\nПри зачете ответов мы будем опираться на критерии, очерченные в вопросах самими авторами либо редактором, то есть все варианты, указанные к каждому вопросу в полях «ответ» и «критерий зачета» будут гарантированно засчитаны вне зависимости от личного мнения ведущего, судейской бригады либо игроков команд. Помимо этого, возможно дополнительное зачтение ответов, не предусмотренных при проектировании пакета, однако сданных командами и кажущихся судейской бригаде верными. Разбирательство по таким ответам будет происходить непосредственно при зачтении верного ответа и (если необходимо) оглашении команд, которым данный вопрос зачтен.\nВсе остальные претензии по зачету ответов рассматриваются апелляционной комиссией.\nДля снижения риска ошибки счетной бригады после каждых 5 вопросов будет проводиться сверка по очкам, а после каждых 15 – по очкам и рейтингу. Просьба к командам оперативно реагировать на несоответствия в сверке.\nНу что ж, вроде бы все технические вопросы решены, так что… слушаем музыку.3:[\"$\",\"div\",null,{\"className\":\"flex flex-col xl:flex-row gap-4 xl:gap-6 w-full mx-auto\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex flex-col gap-2\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-2xl font-normal text-on-surface font-comfortaa\",\"children\":\"Недавно опубликованные\"}],[\"$\",\"$L18\",null,{\"packIds\":[7370,7369,7368,7367,7366,7365,7364,7363,7362,7361],\"initialInteractions\":null,\"children\":[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-4\",\"children\":[[\"$\",\"$L19\",\"7370\",{\"pack\":{\"id\":7370,\"slug\":\"-3-4Wmtxo\",\"title\":\"Чемпионат Гомеля – Этап 3\",\"longTitle\":\"\",\"type\":\"kvrm\",\"startDate\":\"2003-11-01T00:00:00.000Z\",\"endDate\":\"2003-11-01T00:00:00.000Z\",\"pubDate\":\"2026-11-11T16:23:26.542Z\",\"dbchgkinfoslug\":\"\",\"iqgaid\":0,\"info\":\"Вопросы команды «Пластилиновый Хуги».\\nАвторы вопросов: Александр Вороненко, Ксения Чиндарова, Андрей Ходотов, Анна Кравченко, Владислав Дронов.\",\"tIds\":[],\"truedls\":[],\"teams\":[],\"published\":true,\"adultOnly\":false,\"uploaderId\":72,\"discussionURL\":\"\",\"questionCount\":30,\"tourCount\":2,\"likesCount\":2,\"editors\":[{\"id\":4054,\"name\":\"Владислав Дронов\",\"alias\":null},{\"id\":8768,\"name\":\"Ксения Чиндарова\",\"alias\":null},{\"id\":10875,\"name\":\"Александр Вороненко\",\"alias\":null},{\"id\":18062,\"name\":\"Андрей Ходотов\",\"alias\":null},{\"id\":18815,\"name\":\"Анна Кравченко\",\"alias\":null}]}}],[\"$\",\"$L19\",\"7369\",{\"pack\":{\"id\":7369,\"slug\":\"-2-UyZoof\",\"title\":\"Чемпионат Гомеля – Этап 2\",\"longTitle\":\"\",\"type\":\"kvrm\",\"startDate\":\"2003-10-01T00:00:00.000Z\",\"endDate\":\"2003-10-01T00:00:00.000Z\",\"pubDate\":\"2026-11-11T16:20:48.281Z\",\"dbchgkinfoslug\":\"\",\"iqgaid\":0,\"info\":\"$1a\",\"tIds\":[],\
