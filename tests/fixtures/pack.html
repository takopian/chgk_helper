:[10,25,32],\"complexity\":[\"55.56\",\"60.98\",\"59.26\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498270,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498271,\"number\":3,\"text\":\"На рекламном плакате водостойкого косметического средства перед женщиной кое-что происходит. Перед кем, согласно известному источнику, произошло то же самое?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Моисей.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"в рекламе крем от загара настолько сильно отталкивает воду, что море расступается.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498271.png\",\"commentAudio\":\"\",\"source\":\"https://www.adsoftheworld.com/campaigns/pool-ea7d93d0-b491-4333-99e8-299bc10fbb21\",\"ordering\":3,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[14,35,45],\"complexity\":[\"77.78\",\"85.37\",\"83.33\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498271,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498272,\"number\":4,\"text\":\"Генри Ха́ггард объединил разные религии и считал якобы произошедшее ПЕРВОЕ свидетельством ВТОРОЙ. Назовите ПЕРВОЕ и ВТОРУЮ.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"воскресение Иисуса Христа и реинкарнация.\",\"answerPic\":\"\",\"zachet\":\"по словам “воскресение” и “реинкарнация”, “воскрешение” и “реинкарнация” без неправильных уточнений; в любом порядке.\",\"nezachet\":\"\",\"comment\":\"писатель объединил христианство и буддизм.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. https://web.archive.org/web/20240613135036/http://stbenno.worthyofpraise.org/rider-haggard-on-christianity/\\n2. ru.wikipedia.org/wiki/Хаггард,_Генри_Райдер\",\"ordering\":4,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[4,24,27],\"complexity\":[\"22.22\",\"58.54\",\"50\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498272,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498273,\"number\":5,\"text\":\"Транспорт Эми́ля Лере́ сломался в пустыне. Лере утверждает, что, имея набор инструментов, переделал транспортное средство в НЕГО и добрался до цивилизации. Назовите ЕГО словом, содержащим две буквы О.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"мотоцикл.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"упоминание двух букв О намекает на два колеса. Француз утверждает, что в 1993 году за 12 суток в марокканской пустыне превратил автомобиль Citroën 2CV в мотоцикл и доехал на нем до города. Разрушители мифов повторили эксперимент, но мотоцикл постоянно заваливался. Лучший результат ведущих составил 45 метров по ровному асфальту. В 2020 году году Лере продал оригинальный мотоцикл в музей и повторил превращение на камеру, используя только ручной инструмент. Видео езды нет.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498273.jpeg\",\"commentAudio\":\"\",\"source\":\"1. uk.wikipedia.org/wiki/Еміль_Лере\\n2. https://www.youtube.com/watch?v=k_m_a4iRZIk\",\"ordering\":5,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[9,26,27],\"complexity\":[\"50\",\"63.41\",\"50\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498273,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498274,\"number\":6,\"text\":\"Персонажи Ка́рела Ча́пека благодаря ИМ догадываются, что за разными именами скрывается один человек. Назовите ИХ Карела Чапека.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"К. Ч.\",\"answerPic\":\"\",\"zachet\":\"K.Č., K. C; с точками или без.\",\"nezachet\":\"\",\"comment\":\"героиня пьесы “Средство Макро́пулоса” для всех своих личностей использует печать с одинаковыми инициалами.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. en.wikipedia.org/wiki/The_Makropulos_Affair\\n2. goroh.pp.ua/Тлумачення/ініціали\",\"ordering\":6,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[17,38,51],\"complexity\":[\"94.44\",\"92.68\",\"94.44\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498274,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498275,\"number\":7,\"text\":\"На карикатуре в доме Железного Дровосека нет бытового устройства, поэтому ИХ размещают на Дровосеке. Что такое ОНИ?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"магнитики для холодильника.\",\"answerPic\":\"\",\"zachet\":\"магниты для холодильника, магнитики, магниты.\",\"nezachet\":\"\",\"comment\":\"в доме нет холодильника.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498275.png\",\"commentAudio\":\"\",\"source\":\"https://cedricstudio.com/2016/02/sketchbook-silliness-tin-man-at-home/\",\"ordering\":7,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[15,38,46],\"complexity\":[\"83.33\",\"92.68\",\"85.19\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498275,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498276,\"number\":8,\"text\":\"[Ведущему: сделайте интонационную паузу после слова “стерлингов”.]\\nАвтор статьи указывает на соотношение между ценой батончика Mars [марс] и курсом фунта стерлингов и упоминает ЕГО. Отмечают, что ОН не учитывает стоимость аренды помещений. Назовите ЕГО.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"индекс Биг Мака.\",\"answerPic\":\"\",\"zachet\":\"Big Mac Index.\",\"nezachet\":\"\",\"comment\":\"неофициальный способ определения паритета покупательной способности называется индекс Биг Мака.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. en.wikipedia.org/wiki/Mars_bar\\n2. uk.wikipedia.org/wiki/Індекс_БігМака\",\"ordering\":8,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[18,41,49],\"complexity\":[\"100\",\"100\",\"90.74\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498276,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498277,\"number\":9,\"text\":\"Чтобы поток туристов не прекращался круглый год, расположенный в провинции Хэна́нь ПЕРВЫЙ подключили ко ВТОРОМУ. Назовите ПЕРВЫЙ и ВТОРОЙ словами, начинающимися одинаково.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"водопад, водопровод.\",\"answerPic\":\"\",\"zachet\":\"в любом порядке.\",\"nezachet\":\"\",\"comment\":\"вам могло помочь слово поток. Водопад на горе Юнта́й позиционируется как самый высокий непрерывный водопад Китая. Руководство парка утверждает, что ради туристов сделали “небольшое улучшение” на время засушливого сезона.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498277.png\",\"commentAudio\":\"\",\"source\":\"https://www.bbc.com/news/articles/cp99l9gpzwgo\",\"ordering\":9,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[9,18,21],\"complexity\":[\"50\",\"43.9\",\"38.89\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498277,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498278,\"number\":10,\"text\":\"В посвященном Дэвиду А́ттенборо видеоролике ОНА опускает письмо в почтовый ящик британского биолога. Возможно, эта сцена является аллюзией. Назовите ЕЁ.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"сова.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"в ролике по случаю 100-летия Дэвида А́ттенборо разные животные поочередно несут письмо от короля Карла III. Во вселенной Гарри Поттера почту доставляют совы.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://youtu.be/I1D9YF0YapQ\",\"ordering\":10,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[3,25,27],\"complexity\":[\"16.67\",\"60.98\",\"50\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498278,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498279,\"number\":11,\"text\":\"Некоторые люди сравнивают ЕГО с белым лебедем, а другие — с морскими ракушками. В каком городе расположен ОН?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Сидней.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"он — это Сиднейский оперный театр.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://www.woodypines.com/the-sydney-opera-house/\",\"ordering\":11,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[17,41,45],\"complexity\":[\"94.44\",\"100\",\"83.33\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[{\"questionId\":498279,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498280,\"number\":12,\"text\":\"Производители худи с приведенной надписью не учли наличия ЕГО. Назовите ЕГО.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"/pics/7365/pic_498280.jpeg\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"капюшон.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"смысл надписи “Клуб против жестокого обращения с животными” меняется, когда деталь одежды закрывает Anti.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498280.jpeg\",\"commentAudio\":\"\",\"source\":\"https://www.reddit.com/r/NotMyJob/comments/baed3j/hood_on_vs_hood_off/Автор: Константин Ильин (Одесса).\",\"ordering\":12,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[15,34,36],\"complexity\":[\"83.33\",\"82.93\",\"66.67\"],\"teamsCount\":[18,41,54],\"tourId\":37879,\"packId\":7365,\"authors\":[],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":1}]},{\"id\":37880,\"number\":2,\"title\":\"Блок 1\",\"packId\":7365,\"roundId\":null,\"info\":\"\",\"ordering\":2,\"round\":null,\"editors\":[{\"tourId\":37880,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"questions\":[{\"id\":498281,\"number\":13,\"text\":\"В мультфильме показан дом, где прошло детство змеи. Предмет, на котором ДЕЛАЛИ ЭТО, расположен не вертикально, а горизонтально. Что такое ДЕЛАТЬ ЭТО?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"отмечать рост.\",\"answerPic\":\"\",\"zachet\":\"отмечать длину; синонимичные ответы с упоминанием роста или длины.\",\"nezachet\":\"\",\"comment\":\"в мультфильме “Зверополис 2” отмечали длину растущих змей.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498281.png\",\"commentAudio\":\"\",\"source\":\"Zootopia 2, minute 91.\",\"ordering\":1,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[16,39,45],\"complexity\":[\"88.89\",\"95.12\",\"83.33\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498281,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498282,\"number\":14,\"text\":\"Молодой персонаж А́нджея Сапко́вского вырос в горах и хочет кое-что сделать. Герои какого произведения конца ХХ века хотят сделать то же самое?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Достучаться до небес.\",\"answerPic\":\"\",\"zachet\":\"Knockin' On Heaven's Door\",\"nezachet\":\"\",\"comment\":\"и молодой Ге́ральт и персонажи немецкого фильма хотят увидеть море.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. Andrzej Sapkowski Rozdroże kruków\\n2. uk.wikipedia.org/wiki/Достукатись_до_небес_(фільм)\",\"ordering\":2,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[14,32,33],\"complexity\":[\"77.78\",\"78.05\",\"61.11\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498282,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498283,\"number\":15,\"text\":\"В настольной игре Сти́ва Фи́нна игроки управляют средневековыми монастырями. ПЕРВАЯ от этой игры стилизована под ВТОРУЮ. Назовите ПЕРВУЮ и ВТОРУЮ словами, начинающимися на одну букву.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"коробка, книга.\",\"answerPic\":\"\",\"zachet\":\"в любом порядке.\",\"nezachet\":\"\",\"comment\":\"речь идет об игре “Biblios” [би́блиос]. Средневековые монахи переписывали книги.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498283.png\",\"commentAudio\":\"\",\"source\":\"https://boardgamegeek.com/boardgame/34219/biblios\",\"ordering\":3,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[3,9,8],\"complexity\":[\"16.67\",\"21.95\",\"14.81\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498283,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498284,\"number\":16,\"text\":\"Мэттью Ка́ртера назвали наиболее читаемым человеком в мире. Картер разработал несколько сотен ИХ. Назовите ЕГО одним словом.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"шрифт.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"Картер разработал более 60 семейств шрифтов и более 250 отдельных шрифтов.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"en.wikipedia.org/wiki/Matthew_Carter\\nhttps://www.macfound.org/fellows/class-of-2010/matthew-carter\",\"ordering\":4,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[9,30,31],\"complexity\":[\"50\",\"73.17\",\"57.41\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498284,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498285,\"number\":17,\"text\":\"В фильме Брайана Фу́ллера девочка видела лицо киллера, но тот отказывается убивать ребенка. В этой сцене люстра напоминает ЕГО. Назовите ЕГО.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"нимб.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"люстра светится и находится наверху. Киллер из фильма “Поймать монстра” совершает добрый поступок и в конце ленты усыновит девочку.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498285.png\",\"commentAudio\":\"\",\"source\":\"Dust Bunny, minute 36.\",\"ordering\":5,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[16,36,41],\"complexity\":[\"88.89\",\"87.8\",\"75.93\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498285,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498286,\"number\":18,\"text\":\"Во время Второй мировой Германия выпустила по Англии тысячи ракет, но, несмотря на масштабные разрушения, ОНА на Фа́у не оправдала себя. Одна из других НИХ находилась на территории Украины. Назовите ЕЁ двумя словами.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"ставка Гитлера.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"располагавшаяся в Винницкой области ставка диктатора называется Вервольф.\\n\\nС 19 по 36 вопросы Сергея Черка́сова, отредактированные Константином Ильины́м (Одесса).\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. uk.wikipedia.org/wiki/Фау-2\\n2. uk.wikipedia.org/wiki/Вервольф\",\"ordering\":6,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[11,30,36],\"complexity\":[\"61.11\",\"73.17\",\"66.67\"],\"teamsCount\":[18,41,54],\"tourId\":37880,\"packId\":7365,\"authors\":[{\"questionId\":498286,\"personId\":12046,\"alias\":null,\"person\":{\"id\":12046,\"slug\":\"stanislav-shkrebov\",\"name\":\"Станислав Шкребов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":93948,\"alias\":[],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0}]},{\"id\":37881,\"number\":2,\"title\":\"Блок 2\",\"packId\":7365,\"roundId\":null,\"info\":\"\",\"ordering\":3,\"round\":null,\"editors\":[{\"tourId\":37881,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}},{\"tourId\":37881,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"questions\":[{\"id\":498287,\"number\":19,\"text\":\"В XVI веке мужчину по прозвищу Вервольф из Бе́дбурга обвинили в похищениях и убийствах. Этого человека упоминают в книге о литературной героине. Какой именно?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Красная Шапочка.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"Пе́тер Штумпп признался в преступлениях во время пыток. Сказки должны были предупредить и уберечь детей от злодеев.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. en.wikipedia.org/wiki/Peter_Stumpp\\n2. https://talesoffaerie.blogspot.com/2014/06/stubbe-peeter-werewolf-trials-and.html\",\"ordering\":1,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[17,38,45],\"complexity\":[\"94.44\",\"92.68\",\"83.33\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498287,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}},{\"questionId\":498287,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498288,\"number\":20,\"text\":\"На карикатуре работник столовой спрашивает: “Вам здесь или навынос?”. Эта столовая расположена в НЕЙ. Назовите ЕЁ одним словом.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"тюрьма.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\".\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://www.pinterest.com/pin/116882552823716015/\",\"ordering\":2,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[11,37,30],\"complexity\":[\"61.11\",\"90.24\",\"55.56\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498288,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498289,\"number\":21,\"text\":\"Чарльз Диджи́льо рассказал в суде, что уснул за рулем, потому что накануне всю ночь выписывал чеки. Какой глагол мы заменили?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"подделывал.\",\"answerPic\":\"\",\"zachet\":\"фальсифицировал.\",\"nezachet\":\"\",\"comment\":\"у подсудимого не было водительского удостоверения. К тому же мужчина признался, что за день до аварии употреблял кокаин.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://www.mcall.com/2002/08/27/man-who-crashed-into-bus-sentenced-charles-digiglio-tells-carbon-judge-he-fell-asleep-because-hed-been-up-all-night-counterfeiting-checks/\",\"ordering\":3,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[14,33,43],\"complexity\":[\"77.78\",\"80.49\",\"79.63\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498289,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498290,\"number\":22,\"text\":\"После того, как прозвучал стандартный вопрос, присутствующая Мари́ Сэ́ломон стала безостановочно кричать. Этот случай произошел во время ЭТОГО. Назовите ЭТО.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"свадебная церемония.\",\"answerPic\":\"\",\"zachet\":\"по упоминанию свадьбы, брака или венчания.\",\"nezachet\":\"\",\"comment\":\"неуравновешенная женщина начала кричать после слов священника: “Если кто-то знает причину, по которой эти двое не могут быть вместе, скажите сейчас, или молчите навеки”. Женщину арестовали за нарушение общественного порядка.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://abcnews.go.com/US/CrimeBlotter/story?id=92695\u0026page=1\",\"ordering\":4,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[13,34,39],\"complexity\":[\"72.22\",\"82.93\",\"72.22\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498290,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}},{\"questionId\":498290,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498291,\"number\":23,\"text\":\"ТАКОЙ — это замена. Гипотезу, что геоглиф возле Уи́лмингтона создали монахи, считают маловероятной, потому что монахи не изображали бы ТАКОГО человека. В название какого животного входит слово ТАКОЙ?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"голый землекоп.\",\"answerPic\":\"\",\"zachet\":\"засчитали спорный: мексиканская голая собака, землекоп.\",\"nezachet\":\"\",\"comment\":\"геоглиф Длинный человек из Уилмингтона изображает мужчину без одежды. Вы могли обратить внимание, что слово гео означает земля.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498291.png\",\"commentAudio\":\"\",\"source\":\"1. en.wikipedia.org/wiki/Long_Man_of_Wilmington\\n2. uk.wikipedia.org/wiki/Голий_землекоп\",\"ordering\":5,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[12,26,40],\"complexity\":[\"66.67\",\"63.41\",\"74.07\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498291,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498292,\"number\":24,\"text\":\"По словам Криса Па́рра, в начале ХХІ века количество сообщений об НЛО уменьшилось после окончания… чего?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Секретные материалы.\",\"answerPic\":\"\",\"zachet\":\"The X-Files, X-Files.\",\"nezachet\":\"\",\"comment\":\"по словам уфолога, после завершения сериала уменьшилось количество желающих наблюдать за небом.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"http://news.bbc.co.uk/2/hi/uk_news/england/cumbria/4138872.stm\",\"ordering\":6,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[15,30,34],\"complexity\":[\"83.33\",\"73.17\",\"62.96\"],\"teamsCount\":[18,41,54],\"tourId\":37881,\"packId\":7365,\"authors\":[{\"questionId\":498292,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\": nt\":0},{\"id\":498294,\"number\":26,\"text\":\"Элвис Пресли записывал ТАКОЙ альбом летом, поэтому студию украсили разноцветными лампочками. Что мы заменили словом ТАКОЙ?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"рождественский.\",\"answerPic\":\"\",\"zachet\":\"новогодний.\",\"nezachet\":\"\",\"comment\":\"для создания праздничного настроения также установили искусственную елку. Освещение сохранилось до наших времен.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498294.png\",\"commentAudio\":\"\",\"source\":\"https://nashvillemusiccity.wordpress.com/2012/09/22/193-elvis-christmas-lights-in-studio-b/\",\"ordering\":2,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[18,41,50],\"complexity\":[\"100\",\"100\",\"92.59\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498294,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498295,\"number\":27,\"text\":\"Компания Barcelona Design [барсело́на диза́йн] выпустила мебель с вдавленным силуэтом, в описании которой упоминается ТАКОЙ человек. Героиня одного фильма выплескивает краску на ТАКОГО человека. Что мы заменили словом ТАКОЙ?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"невидимый.\",\"answerPic\":\"\",\"zachet\":\"прозрачный.\",\"nezachet\":\"\",\"comment\":\"силуэт создает впечатление присутствия человека. Героиня фильма “Человек-невидимка” 2020 года находит способ видеть прозрачного человека.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. https://web.archive.org/web/20200812131621/https://bdbarcelona.com/en/product/250\\n2. https://www.imdb.com/video/vi2623455001/?playlistId=tt1051906\u0026ref_=tt_ov_ov_vi\",\"ordering\":3,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[15,39,43],\"complexity\":[\"83.33\",\"95.12\",\"79.63\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498295,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}},{\"questionId\":498295,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498296,\"number\":28,\"text\":\"Пьесу “Ната́лка Полта́вка” впервые издали почти через 20 лет после написания, поэтому некоторые украинцы поступали подобно персонажам американского произведения. Назовите это произведение.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"451° по Фаренгейту.\",\"answerPic\":\"\",\"zachet\":\"Fahrenheit 451.\",\"nezachet\":\"\",\"comment\":\"в 1819 году пьесу Ивана Котляре́вского разрешили ставить только в Полтаве. Из-за запрета на печать творческая интеллигенция распространяла немногочисленные рукописи произведения. Подобно персонажам Рэя Брэ́дбери некоторые украинцы выучили пьесу на память.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. https://resh.news/news/11337/\\n2. uk.wikipedia.org/wiki/451_градус_за_Фаренгейтом\",\"ordering\":4,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[7,19,27],\"complexity\":[\"38.89\",\"46.34\",\"50\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498296,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498297,\"number\":29,\"text\":\"[Ведущему (-ей): четко произнесите имя и фамилию.]\\nЖурналисты называют защитника Алесса́ндро Басто́ни неприступным. Автор вопроса обратил внимание, что Бастони является… чем?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"анаграммой слова бастион.\",\"answerPic\":\"\",\"zachet\":\"по упоминанию анаграммы и слова “бастион”.\",\"nezachet\":\"\",\"comment\":\".\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1.\\nhttps://sports.yahoo.com/inter-milan-italy-euro-2024-234600801.html\\n2. https://en.namu.wiki/w/알레산드로%20바스토니\\n3. мнение автора вопроса\",\"ordering\":5,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[13,31,36],\"complexity\":[\"72.22\",\"75.61\",\"66.67\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498297,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":2},{\"id\":498298,\"number\":30,\"text\":\"Мэтью Жан Ро́уз, который не ладил с дедом и нуждался в деньгах, выставил на аукцион eBay [и бэй] ЕГО. Напишите ЕГО.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"среднее имя.\",\"answerPic\":\"\",\"zachet\":\"второе имя, Жан, Мэтью Жан, Мэтью, Мэтью Жан Роуз.\",\"nezachet\":\"\",\"comment\":\"вас попросили не назвать, а написать его. Мужчина получил среднее имя в честь деда. Мужчина предполагает, что новым именем станет название сайта победителя.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"http://news.bbc.co.uk/2/hi/americas/4417391.stm\",\"ordering\":6,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[9,21,23],\"complexity\":[\"50\",\"51.22\",\"42.59\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498298,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498299,\"number\":31,\"text\":\"Несколько лет назад из-за определенных неудобств друзья стали называть одну американку именем Сиз. Напишите её настоящее имя.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Сири.\",\"answerPic\":\"\",\"zachet\":\"Siri.\",\"nezachet\":\"\",\"comment\":\"ранее голосовой помощник Apple активировался по обращению “Эй, Сири”. Но после обновления 2023 года стал реагировать просто на имя.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://www.thesun.co.uk/tech/24255000/change-name-siri-apple-iphone/\",\"ordering\":7,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[4,14,22],\"complexity\":[\"22.22\",\"34.15\",\"40.74\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498299,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":true,\"likesCount\":0},{\"id\":498300,\"number\":32,\"text\":\"В японской сказке родители не могли выбрать имя ребенку. Имя, которое в результате получил младенец, в Японии используют в качестве НЕЁ. Назовите ЕЁ двукоренным словом.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"скороговорка.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"родители решили объединить все предложенные варианты.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. en.wikipedia.org/wiki/Jugemu\\n2. https://urashimatarouremains.blogspot.com/2014/01/japanese-lessons-jugemu-part-i-or.html\",\"ordering\":8,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[5,12,21],\"complexity\":[\"27.78\",\"29.27\",\"38.89\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498300,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498301,\"number\":33,\"text\":\"Перед вами фрагмент картины Сальвадора Дали. Сотрудники какой компании вдохновлялись этой картиной?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"/pics/7365/pic_498301.jpeg\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Barcelona design.\",\"answerPic\":\"\",\"zachet\":\"Барселона дизайн; описательные ответы, из которых понятно, что речь идет об этой компании.\",\"nezachet\":\"\",\"comment\":\"известный вам испанский производитель мебели получил лицензию воспроизвести кресло с картины “Сингулярности”.\",\"note\":\"\",\"commentPic\":\"/pics/7365/commentPic_498301.jpeg\",\"commentAudio\":\"\",\"source\":\"1. https://www.wikiart.org/en/salvador-dali/singularities\\n2. https://web.archive.org/web/20200812131621/https://bdbarcelona.com/en/product/250\",\"ordering\":9,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[11,26,31],\"complexity\":[\"61.11\",\"63.41\",\"57.41\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498301,\"personId\":5401,\"alias\":null,\"person\":{\"id\":5401,\"slug\":\"konstantin-ilin\",\"name\":\"Константин Ильин\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":12511,\"alias\":[\"Константин Ильи́н\",\"Костянтин Ільїн\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":1},{\"id\":498302,\"number\":34,\"text\":\"Ле́стер Хе́мингуэй назвал провозглашенное недалеко от Ямайки государство “Новая ОНА”. Символично, что позже территорию государства уничтожило стихийное бедствие. Назовите ЕЁ.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Атлантида.\",\"answerPic\":\"\",\"zachet\":\"Atlantis.\",\"nezachet\":\"\",\"comment\":\"брат писателя Эрнеста Хе́мингуэя Лестер соорудил плот размером около 2.5 на 9 метров, на котором проживали до 6 человек. Через несколько лет тропические штормы уничтожили плот.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"en.wikipedia.org/wiki/New_Atlantis_(micronation)\",\"ordering\":10,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[17,39,43],\"complexity\":[\"94.44\",\"95.12\",\"79.63\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498302,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":false,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498303,\"number\":35,\"text\":\"Джон Ро́уз пишет, что Наполеон появился сразу готовым к любому военному конфликту, и сравнивает Бонапарта с НЕЙ. Назовите ЕЁ.\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"Афина.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"согласно мифам, богиня появилась на свет из головы Зевса в полном боевом вооружении.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"1. John Holland Rose The Life of Napoleon I\\n2. uk.wikipedia.org/wiki/Афіна\",\"ordering\":11,\"takenDown\":false,\"marked\":false,\"correctAnswers\":[4,24,24],\"complexity\":[\"22.22\",\"58.54\",\"44.44\"],\"teamsCount\":[18,41,54],\"tourId\":37882,\"packId\":7365,\"authors\":[{\"questionId\":498303,\"personId\":13138,\"alias\":null,\"person\":{\"id\":13138,\"slug\":\"sergey-cherkasov\",\"name\":\"Сергей Черкасов\",\"copyrightId\":null,\"namesakes\":true,\"gender\":\"HE\",\"playerId\":117262,\"alias\":[\"Сергей Черка́сов\",\"Сергій Черкасов\"],\"createdAt\":\"2024-05-09T19:05:36.301Z\"}}],\"hasControversials\":true,\"hasAppeals\":false,\"likesCount\":0},{\"id\":498304,\"number\":36,\"text\":\"О́дри Сти́вен случайно добавила кольцо с бриллиантом к НИМ. От какого слова происходит слово ОНИ?\",\"form\":\"\",\"razdatkaText\":\"\",\"razdatkaPic\":\"\",\"audio\":\"\",\"razdatkaPicGeneric\":\"\",\"answer\":\"чай.\",\"answerPic\":\"\",\"zachet\":\"\",\"nezachet\":\"\",\"comment\":\"сотрудники кофейни вернули владелице украшение стоимостью около 5 000 долларов. Они — это чаевые.\",\"note\":\"\",\"commentPic\":\"\",\"commentAudio\":\"\",\"source\":\"https://www.chicagotribune.com/2003/08/19/woman-identifies-ring-lost-in-tip-jar/\",\"ordering\":12,\"takenDown\":false,\"marked\":false,\"correctAn
